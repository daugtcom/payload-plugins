# LiveKit Egress: a headless Chrome that joins the room, records it and uploads the MP4 to the bucket the plugin names in the request.
api_key: devkey
api_secret: secret-secret-secret-secret-secret
ws_url: ws://livekit:7880
redis:
  address: redis:6379
health_port: 8080
log_level: info
# Local machines with 2 CPU cores: Egress refuses room recordings unless it has 4 cores free (the default cost). This lowers the cost so a
# laptop can record one room at a time; on a real server leave it out (give Egress 4+ cores per recording).
cpu_cost:
  room_composite_cpu_cost: 1.5
  web_cpu_cost: 1.5
  participant_cpu_cost: 1.5
